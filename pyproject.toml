[project]
name = "pysamp"
version = "0.1.0"
description = "Terminal sampler/mixer: one keyboard row per song"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp",
    "certifi",
    "sounddevice",
    "soundfile",
    "numpy",
    "textual",
    "imageio-ffmpeg",
]

[project.optional-dependencies]
build = ["pyinstaller"]

[project.scripts]
pysamp = "pysamp.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pysamp"]

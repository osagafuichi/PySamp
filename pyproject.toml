[project]
name = "pysamp"
version = "0.1.0"
description = "Terminal sampler/mixer: one keyboard row per song"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp",
    "sounddevice",
    "soundfile",
    "numpy",
    "textual",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pysamp"]

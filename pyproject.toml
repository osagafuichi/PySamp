[project]
name = "pysamp"
version = "0.4.0"
description = "Browser-based sampler/mixer: one keyboard row per song, custom cue points"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp",
    "certifi",
    "sounddevice",
    "soundfile",
    "numpy",
    "imageio-ffmpeg",
]

[project.optional-dependencies]
build = ["pyinstaller"]

[project.scripts]
pysamp = "pysamp.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pysamp"]

[tool.setuptools.package-data]
pysamp = ["web/*.html", "samples/*/*.ogg"]

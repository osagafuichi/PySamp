<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PySamp</title>
<style>
  :root { --bg:#12151c; --panel:#1b2030; --line:#2b3347; --text:#e6e9f2; --dim:#8b94ab; --accent:#4fd1c5; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 system-ui,sans-serif; user-select:none; }
  main { max-width:1100px; margin:0 auto; padding:16px; min-height:100vh; display:flex; flex-direction:column; }
  main.caps { max-width:1600px; }
  .stage { flex:1; display:flex; gap:14px; }
  #strips { flex:1; min-width:0; display:flex; flex-direction:column; }
  .bar { display:flex; gap:8px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
  .grow { flex:1; }
  button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px 12px; font:inherit; cursor:pointer; }
  button.on { background:var(--accent); color:#06201e; border-color:var(--accent); font-weight:600; }
  button.recording { background:#e53e3e; border-color:#e53e3e; color:#fff; font-weight:600; font-variant-numeric:tabular-nums; }
  .strip { background:var(--panel); border:2px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:10px;
    flex:1 1 0; min-height:130px; display:flex; flex-direction:column; }
  .strip.sel { border-color:var(--accent); }
  .head { display:flex; gap:10px; align-items:center; margin-bottom:6px; }
  .badge { background:var(--bg); border:1px solid var(--line); border-radius:6px; min-width:28px; text-align:center; padding:1px 6px; font-weight:700; }
  .title { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .info { color:var(--dim); font-variant-numeric:tabular-nums; }
  canvas { width:100%; flex:1 1 0; min-height:50px; display:block; border-radius:6px; touch-action:none; }
  .foot { display:flex; gap:10px; align-items:center; margin-top:6px; }
  .vol { width:140px; height:10px; background:var(--bg); border-radius:5px; overflow:hidden; flex:none; }
  .vol i { display:block; height:100%; background:var(--accent); }
  .volnum { width:40px; color:var(--dim); font-variant-numeric:tabular-nums; flex:none; }
  .pitchbox { display:flex; gap:10px; align-items:center; flex:none; cursor:pointer; }
  .pitch { position:relative; width:100px; height:10px; background:var(--bg); border-radius:5px; overflow:hidden; }
  .pitch i { position:absolute; top:0; bottom:0; background:var(--accent); }
  .pitch::after { content:""; position:absolute; left:50%; top:0; bottom:0; width:2px; margin-left:-1px; background:var(--dim); }
  .pitchnum { width:52px; color:var(--dim); font-variant-numeric:tabular-nums; }
  .pitchnum.on { color:var(--text); }
  input { flex:1; min-width:0; background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:5px 8px; font:inherit; user-select:text; }
  #status { margin-top:12px; min-height:20px; }
  #help { color:var(--dim); margin-top:6px; font-size:12px; }
  #drumtag { background:var(--accent); color:#06201e; border-radius:6px; padding:3px 10px; font-weight:700; letter-spacing:.08em; }
  #drums { display:none; flex:none; width:600px; align-self:flex-start; flex-direction:column; gap:6px; margin-bottom:10px; }
  #presets { display:flex; gap:6px; }
  .preset { flex:1 1 0; min-width:0; height:46px; background:var(--panel); border:2px solid var(--line); border-radius:8px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; padding:2px; text-align:center; }
  .preset b { font-size:14px; color:var(--accent); }
  .preset span { font-size:9px; line-height:1.1; color:var(--dim); overflow:hidden; max-height:2.2em; max-width:100%; }
  .preset.on { background:var(--accent); border-color:var(--accent); }
  .preset.on b, .preset.on span { color:#06201e; }
  #padgrid { display:flex; flex-direction:column; gap:6px; }
  #piano { display:none; position:relative; height:210px; margin-bottom:4px; }
  .white, .black { position:absolute; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; cursor:pointer; text-align:center; }
  .white { top:0; bottom:0; background:#e6e9f2; border:1px solid var(--bg); border-radius:0 0 6px 6px; padding-bottom:8px; color:#12151c; }
  .white b { font-size:17px; }
  .white span { font-size:10px; color:#556; }
  .black { top:0; height:60%; z-index:1; background:#0d1017; border:1px solid var(--line); border-radius:0 0 5px 5px; padding-bottom:6px; color:var(--accent); }
  .black b { font-size:15px; }
  .black span { font-size:9px; color:var(--dim); }
  .white.hit { background:var(--accent); }
  .black.hit { background:var(--accent); color:#06201e; }
  .black.hit span { color:#06201e; }
  #keyinfo { display:none; gap:20px; color:var(--dim); font-variant-numeric:tabular-nums; }
  #keyinfo b { color:var(--text); }
  .drumrow { display:flex; gap:6px; height:92px; }
  .drumrow:nth-child(2) { padding-left:10px; }
  .drumrow:nth-child(3) { padding-left:20px; }
  .pad { flex:1 1 0; min-width:0; background:var(--panel); border:2px solid var(--line); border-radius:8px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:2px; text-align:center; }
  .pad b { font-size:18px; color:var(--accent); }
  .pad span { font-size:9px; line-height:1.1; color:var(--dim); overflow:hidden; max-height:2.2em; max-width:100%; }
  .pad.hit { background:var(--accent); border-color:var(--accent); }
  .pad.hit b, .pad.hit span { color:#06201e; }
  #takes { display:none; flex-direction:column; min-height:0; }
  #takehead { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.08em; margin-bottom:4px; }
  #lanes { flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:6px; }
  .lane { flex:none; height:78px; background:var(--panel); border:2px solid var(--line); border-radius:8px; padding:4px 8px; display:flex; flex-direction:column; }
  .lane.live { display:none; border-color:#e53e3e; }
  .lane.playing { border-color:var(--accent); }
  .lanehead { display:flex; gap:8px; align-items:center; margin-bottom:3px; font-size:12px; }
  .lanehead b { font-size:13px; }
  .lane button { padding:1px 9px; font-size:12px; }
  .lane canvas { min-height:20px; cursor:pointer; }
  .lane.live canvas { cursor:default; }
  main.studio { height:100vh; min-height:0; }
  main.studio .stage { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); grid-template-rows:minmax(0,1fr) minmax(0,1fr); min-height:0; }
  main.studio #strips { grid-column:1 / 3; overflow-y:auto; }
  main.studio .strip { min-height:50px; padding:4px 10px; margin-bottom:4px; }
  main.studio .foot { display:none; }
  main.studio canvas { min-height:12px; }
  main.studio #drums { width:auto; align-self:stretch; margin-bottom:0; min-height:0; }
  main.studio #piano { height:auto; flex:1; min-height:70px; }
  main.studio #padgrid { flex:1; min-height:0; }
  main.studio .drumrow { height:auto; flex:1; }
  main.studio #takes { display:flex; }
  main.studio .lane.live.on { display:flex; }
  @media (max-width:1000px) {
    .stage { flex-direction:column; }
    #drums { width:auto; align-self:stretch; }
  }
  #offline { display:none; background:#742a2a; border-radius:6px; padding:8px 12px; margin-bottom:12px; }
</style>
</head>
<body>
<main>
  <div id="offline">PySamp is not running. Close this tab, or start PySamp again.</div>
  <div class="bar">
    <button id="mode"></button>
    <span id="drumtag" hidden>DRUMS</span>
    <button id="bank0">Bank A: songs 1-4</button>
    <button id="bank1">Bank B: songs 5-8</button>
    <button id="page0">Page 1: cues 1-9</button>
    <button id="page1">Page 2: cues 10-18</button>
    <span class="grow"></span>
    <button id="rec">Record (\)</button>
    <button id="quit">Quit</button>
  </div>
  <div class="stage">
    <div id="strips"></div>
    <div id="drums"><div id="presets"></div><div id="piano"></div><div id="keyinfo"></div><div id="padgrid"></div></div>
    <div id="takes"><div id="takehead">Recordings</div><div id="lanes"><div class="lane live"><div class="lanehead"><b>Recording</b><span class="info"></span></div><canvas></canvas></div></div></div>
  </div>
  <div id="status"></div>
  <div id="help"></div>
</main>
<script>
const T = new URLSearchParams(location.search).get("t");
const ROW_KEYS = ["1234567890", "qwertyuiop", "asdfghjkl;", "zxcvbnm,./"];
const ROW_CODES = [
  ["Digit1", "Digit2", "Digit3", "Digit4", "Digit5", "Digit6", "Digit7", "Digit8", "Digit9", "Digit0"],
  ["KeyQ", "KeyW", "KeyE", "KeyR", "KeyT", "KeyY", "KeyU", "KeyI", "KeyO", "KeyP"],
  ["KeyA", "KeyS", "KeyD", "KeyF", "KeyG", "KeyH", "KeyJ", "KeyK", "KeyL", "Semicolon"],
  ["KeyZ", "KeyX", "KeyC", "KeyV", "KeyB", "KeyN", "KeyM", "Comma", "Period", "Slash"],
];
const CODE_TO_SLOT = {};
ROW_CODES.forEach((codes, row) => codes.forEach((code, col) => { CODE_TO_SLOT[code] = [row, col]; }));
const ROWS = 4, SONGS = 8, PER_PAGE = 9, NUM_CUES = 18, SEEK = 5, KEY_STEP = 0.05, WHEEL_GAIN = 0.0003;
const PITCH_MIN = 0.5, PITCH_MAX = 2, PITCH_GAIN = 0.0001;
const HELP = {
  edit: "Edit mode: 1/Q/A/Z select a song | Space play/pause | M mark cue | Left/Right seek 5s | hold a cue key + Backspace delete that cue | Backspace alone delete last cue | " +
    "drag waveform to seek | Tab bank | ` page (tap = stay, hold = back on release) | Enter play mode | scroll = volume | right-click or Option + scroll = pitch | Caps Lock = instruments and drums | \\ = record",
  play: "Play mode: 1/Q/A/Z select a song | other row keys trigger cues (other songs stop; hold Shift to keep them playing) | Left/Right volume | Space stop all | " +
    "Tab bank | ` page (tap = stay, hold = back on release) | Enter edit mode | scroll = volume | right-click or Option + scroll = pitch | Caps Lock = instruments and drums | \\ = record",
};

const DRUM_HELP = "Caps Lock is on: 1-9 pick an instrument, 0 picks the drum kit | Q-P, A-; and Z-/ play the drums | songs keep playing | Tab bank | ` page | Enter mode | \\ record | turn Caps Lock off to go back";
const PIANO_HELP = "Caps Lock is on: 1-9 pick an instrument, 0 picks the drum kit | A-' white keys, W E T Y U O P black keys (hold to sustain) | Z/X octave down/up | C/V velocity down/up | songs keep playing | Tab bank | ` page | \\ record | turn Caps Lock off to go back";
const PIANO = { KeyA: 0, KeyW: 1, KeyS: 2, KeyE: 3, KeyD: 4, KeyF: 5, KeyT: 6, KeyG: 7, KeyY: 8, KeyH: 9, KeyU: 10, KeyJ: 11, KeyK: 12, KeyO: 13, KeyL: 14, KeyP: 15, Semicolon: 16, Quote: 17 };
const PIANO_LABEL = ["A", "W", "S", "E", "D", "F", "T", "G", "Y", "H", "U", "J", "K", "O", "L", "P", ";", "'"];
const WHITE = [0, 2, 4, 5, 7, 9, 11, 12, 14, 16, 17];
const NOTE_NAMES = ["C", "Db", "D", "Eb", "E", "F", "Gb", "G", "Ab", "A", "Bb", "B"];
const OCTAVE_MIN = -1, OCTAVE_MAX = 2, VELOCITY_STEP = 0.1;
const noteName = (midi) => NOTE_NAMES[midi % 12] + (Math.floor(midi / 12) - 1);
let S = null;
let offline = false;
let vol = { song: -1, value: 0, until: 0 };
let pitch = { song: -1, value: 1, until: 0 };
let drag = null;
const held = new Map();
const HOLD_MS = 250;
const flips = new Map();
const DRUM_KIT = -1;
const ui = { mode: "edit", bank: 0, page: 0, selected: 0, caps: false, preset: DRUM_KIT, octave: 1, velocity: 0.8 };
const peaks = {};
const $ = (id) => document.getElementById(id);
const songOf = (row) => ui.bank * ROWS + row;

function send(cmd) {
  fetch("/cmd?t=" + T, { method: "POST", body: JSON.stringify(cmd) }).catch(() => {});
}

function clock(seconds) {
  const s = Math.floor(seconds);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}

function fmt(samples) {
  return clock(samples / S.rate);
}

function toggleRecord() {
  if (S) send({ action: "record", on: S.recording === null });
}

function setBank(bank) {
  ui.bank = bank;
  ui.selected = bank * ROWS + (ui.selected % ROWS);
}

function nudgeVolume(song, delta) {
  if (!S || !S.songs[song].loaded) return;
  const current = vol.song === song && performance.now() < vol.until ? vol.value : S.songs[song].volume;
  const value = Math.min(1, Math.max(0, current + delta));
  vol = { song, value, until: performance.now() + 250 };
  send({ action: "volume", song, value });
}

function setPitch(song, rate) {
  if (!S || !S.songs[song].loaded) return;
  pitch = { song, value: rate, until: performance.now() + 250 };
  send({ action: "pitch", song, value: rate });
}

function nudgePitch(song, octaves) {
  if (!S || !S.songs[song].loaded) return;
  const current = pitch.song === song && performance.now() < pitch.until ? pitch.value : S.songs[song].pitch;
  setPitch(song, Math.min(PITCH_MAX, Math.max(PITCH_MIN, current * 2 ** octaves)));
}

function fetchPeaks(song, id) {
  peaks[song] = { id, data: null };
  fetch("/peaks/" + song + "?t=" + T)
    .then((r) => r.json())
    .then((data) => { if (peaks[song].id === id) peaks[song].data = data; })
    .catch(() => {});
}

const takePeaks = {};
const live = [];
const lanes = [];
let laneIds = "";

const strips = [];
for (let row = 0; row < ROWS; row++) {
  const el = document.createElement("section");
  el.className = "strip";
  el.innerHTML =
    '<div class="head"><span class="badge"></span><span class="title"></span><span class="info"></span></div>' +
    "<canvas></canvas>" +
    '<div class="foot"><div class="vol"><i></i></div><span class="volnum"></span>' +
    '<div class="pitchbox" title="Pitch. Click to reset."><div class="pitch"><i></i></div><span class="pitchnum"></span></div>' +
    '<input placeholder="Paste a YouTube link or file path to load into this slot"><button>Load</button></div>';
  $("strips").append(el);
  const s = {
    el, row,
    canvas: el.querySelector("canvas"),
    badge: el.querySelector(".badge"),
    title: el.querySelector(".title"),
    info: el.querySelector(".info"),
    fill: el.querySelector(".vol i"),
    volnum: el.querySelector(".volnum"),
    pitchBox: el.querySelector(".pitchbox"),
    pitchFill: el.querySelector(".pitch i"),
    pitchNum: el.querySelector(".pitchnum"),
    input: el.querySelector("input"),
  };
  const load = () => {
    const source = s.input.value.trim();
    if (!source) return;
    send({ action: "load", song: songOf(row), source });
    s.input.value = "";
    s.input.blur();
  };
  el.addEventListener("mousedown", () => { ui.selected = songOf(row); });
  s.pitchBox.addEventListener("click", () => setPitch(songOf(row), 1));
  s.canvas.addEventListener("pointerdown", (e) => onWaveDown(s, e));
  s.canvas.addEventListener("pointermove", (e) => { if (drag && drag.s === s) drag.fraction = waveFraction(s, e); });
  s.canvas.addEventListener("pointerup", endDrag);
  s.canvas.addEventListener("pointercancel", endDrag);
  el.querySelector("button").addEventListener("click", load);
  s.input.addEventListener("keydown", (e) => { if (e.key === "Enter") load(); });
  strips.push(s);
}

const pads = [];
const keys = [];
const sounding = new Map();
let labeledKeys = "";
let chipsNamed = false;
ROW_KEYS.slice(1).forEach((keys, row) => {
  const line = document.createElement("div");
  line.className = "drumrow";
  [...keys].forEach((key, col) => {
    const pad = row * 10 + col;
    const el = document.createElement("div");
    el.className = "pad";
    el.innerHTML = "<b>" + key.toUpperCase() + "</b><span></span>";
    el.addEventListener("pointerdown", () => padOn(pad));
    el.addEventListener("pointerup", () => padOff(pad));
    el.addEventListener("pointerleave", () => padOff(pad));
    line.append(el);
    pads.push(el);
  });
  $("padgrid").append(line);
});

PIANO_LABEL.forEach((label, semi) => {
  const white = WHITE.includes(semi);
  const el = document.createElement("div");
  el.className = white ? "white" : "black";
  el.innerHTML = "<b>" + label + "</b><span></span>";
  const unit = 100 / WHITE.length;
  if (white) {
    el.style.left = WHITE.indexOf(semi) * unit + "%";
    el.style.width = unit + "%";
  } else {
    const before = WHITE.filter((w) => w < semi).length;
    el.style.left = before * unit - unit * 0.3 + "%";
    el.style.width = unit * 0.6 + "%";
  }
  el.addEventListener("pointerdown", () => pianoOn(semi));
  el.addEventListener("pointerup", () => pianoOff(semi));
  el.addEventListener("pointerleave", () => pianoOff(semi));
  $("piano").append(el);
  keys.push(el);
});

const chips = [];
[...ROW_KEYS[0]].forEach((key, col) => {
  const el = document.createElement("div");
  el.className = "preset";
  el.innerHTML = "<b>" + key + "</b><span></span>";
  const preset = col === 9 ? DRUM_KIT : col;
  el.addEventListener("pointerdown", () => setPreset(preset));
  $("presets").append(el);
  chips.push({ el, preset });
});

function sizeCanvas(cv) {
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
  }
  const g = cv.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = "#0d1017";
  g.fillRect(0, 0, w, h);
  return { g, w, h };
}

function syncLanes() {
  const ids = S.takes.map((t) => t.id).join("|");
  if (ids === laneIds) return;
  laneIds = ids;
  lanes.forEach((lane) => lane.el.remove());
  lanes.length = 0;
  const liveEl = document.querySelector(".lane.live");
  S.takes.forEach((take, index) => {
    const el = document.createElement("div");
    el.className = "lane";
    el.innerHTML =
      '<div class="lanehead"><button class="play">Play</button><b></b><span class="info grow"></span>' +
      '<button class="tosong" title="Load this take into the selected song slot">Use as song</button><button class="del" title="Remove from the list (the wav stays saved)">x</button></div><canvas></canvas>';
    const lane = { el, id: take.id, canvas: el.querySelector("canvas"), play: el.querySelector(".play"), info: el.querySelector(".info") };
    el.querySelector("b").textContent = take.title;
    lane.play.addEventListener("click", () => send({ action: "take_toggle", take: index }));
    el.querySelector(".tosong").addEventListener("click", () => send({ action: "take_to_song", take: index, song: ui.selected }));
    el.querySelector(".del").addEventListener("click", () => send({ action: "take_delete", take: index }));
    lane.canvas.addEventListener("pointerdown", (e) => {
      const r = lane.canvas.getBoundingClientRect();
      send({ action: "take_seek", take: index, fraction: Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) });
    });
    $("lanes").insertBefore(el, liveEl);
    lanes.push(lane);
    if (!takePeaks[take.id]) {
      takePeaks[take.id] = { data: null };
      fetch("/peaks/take/" + index + "?t=" + T)
        .then((r) => r.json())
        .then((data) => { takePeaks[take.id].data = data; })
        .catch(() => { delete takePeaks[take.id]; });
    }
  });
  $("lanes").scrollTop = $("lanes").scrollHeight;
}

function drawLane(lane, take) {
  lane.el.classList.toggle("playing", take.playing);
  lane.play.textContent = take.playing ? "Stop" : "Play";
  lane.info.textContent = fmt(take.pos) + " / " + fmt(take.total);
  const { g, w, h } = sizeCanvas(lane.canvas);
  const mid = h / 2, playX = (take.pos / take.total) * w;
  const p = takePeaks[take.id] && takePeaks[take.id].data;
  if (p) {
    const n = p.max.length;
    for (let x = 0; x < w; x++) {
      const i = Math.min(n - 1, Math.floor((x / w) * n));
      g.fillStyle = x < playX ? "#4fd1c5" : "#4a5878";
      g.fillRect(x, mid - p.max[i] * mid * 0.95, 1, Math.max(1, (p.max[i] - p.min[i]) * mid * 0.95));
    }
  }
  g.fillStyle = take.playing ? "#ffffff" : "#cbd5e0";
  g.fillRect(Math.round(playX) - 1, 0, 2, h);
}

function drawLive() {
  const el = document.querySelector(".lane.live");
  el.classList.toggle("on", S.recording !== null);
  if (S.recording === null) return;
  el.querySelector(".info").textContent = clock(S.recording);
  const { g, w, h } = sizeCanvas(el.querySelector("canvas"));
  const mid = h / 2, n = live.length;
  g.fillStyle = "#e53e3e";
  for (let x = 0; x < w; x++) {
    const from = Math.floor((x / w) * n), to = Math.max(from + 1, Math.floor(((x + 1) / w) * n));
    let peak = 0;
    for (let i = from; i < Math.min(to, n); i++) peak = Math.max(peak, live[i]);
    if (peak > 0) g.fillRect(x, mid - peak * mid * 0.95, 1, Math.max(1, peak * mid * 1.9));
  }
}

function setPreset(preset) {
  ui.preset = preset;
  if (preset !== DRUM_KIT) send({ action: "preset", preset });
}

function padOn(pad) {
  pads[pad].classList.add("hit");
  send({ action: "drum", pad });
}

function padOff(pad) {
  pads[pad].classList.remove("hit");
}

function pianoOn(semi) {
  if (ui.preset === DRUM_KIT || !S || sounding.has(semi)) return;
  const midi = S.presets[ui.preset].base + 12 * ui.octave + semi;
  sounding.set(semi, { preset: ui.preset, midi });
  keys[semi].classList.add("hit");
  send({ action: "note", preset: ui.preset, midi, on: true, velocity: ui.velocity });
}

function pianoOff(semi) {
  keys[semi].classList.remove("hit");
  const note = sounding.get(semi);
  if (!note) return;
  sounding.delete(semi);
  send({ action: "note", preset: note.preset, midi: note.midi, on: false });
}

function releaseAllPads() {
  pads.forEach((_, pad) => padOff(pad));
  keys.forEach((_, semi) => pianoOff(semi));
}

function setCaps(on) {
  if (ui.caps && !on) releaseAllPads();
  ui.caps = on;
}

function labelKeys() {
  const id = ui.preset + ":" + ui.octave;
  if (labeledKeys === id) return;
  labeledKeys = id;
  if (ui.preset === DRUM_KIT) {
    pads.forEach((el, pad) => { el.querySelector("span").textContent = S.drum_names[pad]; });
    return;
  }
  const base = S.presets[ui.preset].base + 12 * ui.octave;
  keys.forEach((el, semi) => { el.querySelector("span").textContent = noteName(base + semi); });
}

function pianoKey(code) {
  if (code in PIANO) pianoOn(PIANO[code]);
  else if (code === "KeyZ") ui.octave = Math.max(OCTAVE_MIN, ui.octave - 1);
  else if (code === "KeyX") ui.octave = Math.min(OCTAVE_MAX, ui.octave + 1);
  else if (code === "KeyC") ui.velocity = Math.max(VELOCITY_STEP, Math.round((ui.velocity - VELOCITY_STEP) * 10) / 10);
  else if (code === "KeyV") ui.velocity = Math.min(1, Math.round((ui.velocity + VELOCITY_STEP) * 10) / 10);
}

function slotPad(code) {
  const slot = CODE_TO_SLOT[code];
  return slot && slot[0] > 0 ? (slot[0] - 1) * 10 + slot[1] : -1;
}

function waveFraction(s, e) {
  const rect = s.canvas.getBoundingClientRect();
  return Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
}

function onWaveDown(s, e) {
  if (e.button !== 0) return;
  const song = songOf(s.row);
  const d = S && S.songs[song];
  if (!d || !d.loaded) return;
  const width = s.canvas.getBoundingClientRect().width;
  const x = waveFraction(s, e) * width;
  let hit = -1, best = 8;
  d.cues.forEach((cue, slot) => {
    if (cue === null || Math.floor(slot / PER_PAGE) !== ui.page) return;
    const dx = Math.abs((cue / d.total) * width - x);
    if (dx < best) { best = dx; hit = slot; }
  });
  if (hit >= 0) send({ action: "trigger", song, cue: hit, layer: e.shiftKey });
  else if (ui.mode === "edit") {
    s.canvas.setPointerCapture(e.pointerId);
    drag = { s, song, fraction: x / width, sent: null };
  }
}

function flushDrag() {
  if (drag && drag.fraction !== drag.sent) {
    drag.sent = drag.fraction;
    send({ action: "seek_to", song: drag.song, fraction: drag.fraction });
  }
}

function endDrag() {
  flushDrag();
  drag = null;
}

function drawWave(s, d) {
  const cv = s.canvas, dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
  }
  const g = cv.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = "#0d1017";
  g.fillRect(0, 0, w, h);
  g.textAlign = "center";
  g.font = "14px system-ui";
  g.fillStyle = "#8b94ab";
  if (!d.loaded) {
    g.fillText("Empty slot. Paste a link below and press Load.", w / 2, h / 2);
    return;
  }
  const p = peaks[songOf(s.row)];
  const mid = h / 2, playX = (d.pos / d.total) * w;
  if (p && p.data && p.id === d.id) {
    const n = p.data.max.length;
    for (let x = 0; x < w; x++) {
      const i = Math.min(n - 1, Math.floor((x / w) * n));
      const top = mid - p.data.max[i] * mid * 0.95;
      const bottom = mid - p.data.min[i] * mid * 0.95;
      g.fillStyle = x < playX ? "#4fd1c5" : "#4a5878";
      g.fillRect(x, top, 1, Math.max(1, bottom - top));
    }
  } else {
    g.fillText("Drawing waveform...", w / 2, h / 2);
  }
  g.font = "bold 11px system-ui";
  d.cues.forEach((cue, slot) => {
    if (cue === null) return;
    const x = Math.round((cue / d.total) * w) + 0.5;
    const onPage = Math.floor(slot / PER_PAGE) === ui.page;
    const active = slot === d.active_cue;
    g.strokeStyle = onPage ? (active ? "#ffffff" : "#f6ad55") : "rgba(255,255,255,0.2)";
    g.lineWidth = 1;
    g.beginPath();
    g.moveTo(x, 0);
    g.lineTo(x, h);
    g.stroke();
    if (onPage) {
      const lx = Math.min(Math.max(x, 9), w - 9);
      g.fillStyle = active ? "#ffffff" : "#f6ad55";
      g.fillRect(lx - 8, 0, 16, 16);
      g.fillStyle = "#12151c";
      g.fillText(ROW_KEYS[s.row][(slot % PER_PAGE) + 1].toUpperCase(), lx, 12);
    }
  });
  g.fillStyle = d.playing ? "#ffffff" : "#cbd5e0";
  g.fillRect(Math.round(playX) - 1, 0, 2, h);
}

function drawStrip(s) {
  const song = songOf(s.row), d = S.songs[song];
  s.el.classList.toggle("sel", song === ui.selected);
  s.badge.textContent = ROW_KEYS[s.row][0].toUpperCase();
  s.pitchBox.style.visibility = d.loaded ? "visible" : "hidden";
  s.canvas.style.cursor = ui.mode === "edit" ? "ew-resize" : "default";
  if (d.loaded) {
    const used = d.cues.filter((c) => c !== null).length;
    s.title.textContent = "Song " + (song + 1) + " - " + d.title;
    s.info.textContent = fmt(d.pos) + " / " + fmt(d.total) + "  |  cues " + used + "/" + NUM_CUES + "  |  " + (d.playing ? "playing" : "stopped");
    s.fill.style.width = d.volume * 100 + "%";
    s.volnum.textContent = Math.round(d.volume * 100) + "%";
    const octaves = Math.log2(d.pitch), raw = (d.pitch - 1) * 100;
    const percent = Math.abs(raw) < 0.05 ? 0 : raw;
    s.pitchFill.style.left = (octaves < 0 ? 50 + octaves * 50 : 50) + "%";
    s.pitchFill.style.width = Math.abs(octaves) * 50 + "%";
    s.pitchNum.textContent = (percent > 0 ? "+" : "") + percent.toFixed(1) + "%";
    s.pitchNum.classList.toggle("on", percent !== 0);
  } else {
    s.title.textContent = "Song " + (song + 1) + " - empty";
    s.info.textContent = "";
    s.fill.style.width = "0";
    s.volnum.textContent = "";
    s.pitchFill.style.width = "0";
    s.pitchNum.textContent = "";
  }
  drawWave(s, d);
}

function render() {
  requestAnimationFrame(render);
  flushDrag();
  $("mode").textContent = ui.mode.toUpperCase() + " MODE (Enter to switch)";
  $("mode").classList.toggle("on", ui.mode === "play");
  for (const i of [0, 1]) {
    $("bank" + i).classList.toggle("on", ui.bank === i);
    $("page" + i).classList.toggle("on", ui.page === i);
  }
  const piano = ui.preset !== DRUM_KIT;
  $("help").textContent = ui.caps ? (piano ? PIANO_HELP : DRUM_HELP) + (S && S.takes.length ? " | click a recording to play it from there" : "") : HELP[ui.mode];
  $("drumtag").hidden = !ui.caps;
  if (S) $("drumtag").textContent = (ui.preset === DRUM_KIT ? "DRUMS" : S.presets[ui.preset].label).toUpperCase();
  chips.forEach((c) => c.el.classList.toggle("on", c.preset === ui.preset));
  document.querySelector("main").classList.toggle("caps", ui.caps);
  const studio = ui.caps && S !== null && (S.recording !== null || S.takes.length > 0);
  document.querySelector("main").classList.toggle("studio", studio);
  $("drums").style.display = ui.caps ? "flex" : "none";
  $("padgrid").style.display = piano ? "none" : "flex";
  $("piano").style.display = piano ? "block" : "none";
  $("keyinfo").style.display = piano ? "flex" : "none";
  if (S && piano) {
    const base = S.presets[ui.preset].base + 12 * ui.octave;
    $("keyinfo").innerHTML = "<span>Octave <b>" + noteName(base) + "</b> (Z / X)</span><span>Velocity <b>" + Math.round(ui.velocity * 100) + "%</b> (C / V)</span>";
  }
  $("offline").style.display = offline ? "block" : "none";
  const recording = S !== null && S.recording !== null;
  $("rec").classList.toggle("recording", recording);
  $("rec").textContent = recording ? "Stop recording " + clock(S.recording) + " (\\)" : "Record (\\)";
  if (S) {
    $("status").textContent = S.status;
    S.songs.forEach((d, i) => {
      if (d.loaded && (!peaks[i] || peaks[i].id !== d.id)) fetchPeaks(i, d.id);
    });
    if (!chipsNamed) {
      chips.forEach((c) => { c.el.querySelector("span").textContent = c.preset === DRUM_KIT ? "Drums" : S.presets[c.preset].label; });
      chipsNamed = true;
    }
    labelKeys();
    syncLanes();
    strips.forEach(drawStrip);
    if (studio) {
      lanes.forEach((lane, i) => drawLane(lane, S.takes[i]));
      drawLive();
    }
  }
}

function editKey(code, song) {
  if (code === "Space") send({ action: "toggle_play", song });
  else if (code === "ArrowLeft" || code === "ArrowRight") send({ action: "seek", song, seconds: code === "ArrowRight" ? SEEK : -SEEK });
  else if (code === "KeyM") send({ action: "mark", song });
  else if (code === "Backspace") deleteCue(song);
  else return false;
  return true;
}

function playKey(code, song) {
  if (code === "ArrowLeft" || code === "ArrowRight") nudgeVolume(song, code === "ArrowRight" ? KEY_STEP : -KEY_STEP);
  else if (code === "Space") send({ action: "stop_all" });
  else return false;
  return true;
}

function deleteCue(song) {
  const last = [...held.values()].pop();
  if (!last) send({ action: "remove_last_cue", song });
  else if (!last.used) {
    last.used = true;
    send({ action: "remove_cue", song: last.song, cue: last.cue });
  }
}

function rowKey(code, row, col, layer) {
  const song = songOf(row);
  if (col > 0) {
    const cue = ui.page * PER_PAGE + col - 1;
    held.set(code, { song, cue, used: false });
    send({ action: "trigger", song, cue, layer });
  }
  ui.selected = song;
}

document.addEventListener("keydown", (e) => {
  setCaps(e.getModifierState("CapsLock"));
  if (e.target.tagName === "INPUT") {
    if (e.code === "Escape") e.target.blur();
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const code = e.code, song = ui.selected;
  if (code === "Backslash") {
    e.preventDefault();
    if (!e.repeat) toggleRecord();
    return;
  }
  if (ui.caps && (code in CODE_TO_SLOT || code in PIANO)) {
    e.preventDefault();
    if (e.repeat) return;
    if (code in CODE_TO_SLOT && CODE_TO_SLOT[code][0] === 0) {
      const col = CODE_TO_SLOT[code][1];
      setPreset(col === 9 ? DRUM_KIT : col);
    }
    else if (ui.preset === DRUM_KIT) { if (slotPad(code) >= 0) padOn(slotPad(code)); }
    else pianoKey(code);
    return;
  }
  const known = ["Tab", "Space", "Enter", "Backspace", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Backquote"];
  if (!known.includes(code) && !(code in CODE_TO_SLOT)) return;
  e.preventDefault();
  if (!S || (e.repeat && code !== "ArrowLeft" && code !== "ArrowRight")) return;
  if (code === "Tab") {
    flips.set(code, { at: performance.now(), bank: ui.bank });
    setBank(1 - ui.bank);
  }
  else if (code === "Backquote") {
    flips.set(code, { at: performance.now(), page: ui.page });
    ui.page = 1 - ui.page;
  }
  else if (code === "Enter") ui.mode = ui.mode === "edit" ? "play" : "edit";
  else if (code === "ArrowUp" || code === "ArrowDown") {
    ui.selected = (ui.selected + (code === "ArrowDown" ? 1 : -1) + SONGS) % SONGS;
    ui.bank = Math.floor(ui.selected / ROWS);
  }
  else if (ui.mode === "edit" && editKey(code, song)) { /* handled */ }
  else if (ui.mode === "play" && playKey(code, song)) { /* handled */ }
  else if (code in CODE_TO_SLOT) rowKey(code, ...CODE_TO_SLOT[code], e.shiftKey);
});

function releaseFlip(code) {
  const flip = flips.get(code);
  if (!flip) return;
  flips.delete(code);
  if (performance.now() - flip.at < HOLD_MS) return;
  if (code === "Tab") setBank(flip.bank);
  else ui.page = flip.page;
}

document.addEventListener("keyup", (e) => {
  held.delete(e.code);
  const pad = slotPad(e.code);
  if (pad >= 0) padOff(pad);
  if (e.code in PIANO) pianoOff(PIANO[e.code]);
  releaseFlip(e.code);
  setCaps(e.getModifierState("CapsLock"));
});
document.addEventListener("pointermove", (e) => { setCaps(e.getModifierState("CapsLock")); });
window.addEventListener("blur", () => {
  held.clear();
  releaseAllPads();
  [...flips.keys()].forEach(releaseFlip);
});

function wheelAmount(delta, mode) {
  return mode === 1 ? delta * 33 : mode === 2 ? delta * 400 : delta;
}

window.addEventListener("wheel", (e) => {
  if (e.ctrlKey) return;
  e.preventDefault();
  const dy = wheelAmount(e.deltaY, e.deltaMode), dx = wheelAmount(e.deltaX, e.deltaMode);
  const amount = Math.abs(dy) >= Math.abs(dx) ? -dy : dx;
  if (e.buttons & 2 || e.altKey) nudgePitch(ui.selected, amount * PITCH_GAIN);
  else nudgeVolume(ui.selected, amount * WHEEL_GAIN);
}, { passive: false });

document.addEventListener("contextmenu", (e) => { if (e.target.tagName !== "INPUT") e.preventDefault(); });

$("mode").addEventListener("click", () => { ui.mode = ui.mode === "edit" ? "play" : "edit"; });
$("bank0").addEventListener("click", () => setBank(0));
$("bank1").addEventListener("click", () => setBank(1));
$("page0").addEventListener("click", () => { ui.page = 0; });
$("page1").addEventListener("click", () => { ui.page = 1; });
$("rec").addEventListener("click", toggleRecord);
$("quit").addEventListener("click", () => send({ action: "quit" }));
document.addEventListener("click", (e) => { if (e.target.tagName === "BUTTON") e.target.blur(); });

const events = new EventSource("/events?t=" + T);
events.onmessage = (e) => {
  S = JSON.parse(e.data);
  offline = false;
  if (S.recording === null) live.length = 0;
  else live.push(S.level);
};
events.onerror = () => { offline = true; };
render();
</script>
</body>
</html>
